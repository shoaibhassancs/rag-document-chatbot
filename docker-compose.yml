services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Compose the database host is the service name "db".
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-ragdb}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    volumes:
      # Sample documents, read-only, so the ingest CLI can run inside the container:
      #   docker compose run --rm api python -m scripts.ingest_folder /app/data/sample_docs
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  # The demo chat UI. Behind a profile so that a plain `docker compose up` starts only the API
  # and the database. Start it with `docker compose --profile ui up --build`.
  ui:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        STREAMLIT_VERSION: ${STREAMLIT_VERSION:-1.66.0}  # the version in uv.lock; .env can override
    environment:
      API_BASE_URL: http://api:8000
      # Only the app key, passed explicitly. Never env_file or a .env mount: the UI must not receive
      # the Groq or Voyage keys.
      APP_API_KEY: ${APP_API_KEY:-}
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-8510}:8501"
    depends_on:
      - api

volumes:
  pgdata:
